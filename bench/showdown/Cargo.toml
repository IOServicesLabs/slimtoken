[package]
name = "slimtoken-showdown"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Side-by-side terminal benchmark: one model stream vs a SlimToken parallel wave"
license = "MIT OR Apache-2.0"
publish = false

# Standalone crate: the TUI dependencies stay out of the engine's build.
[workspace]

[[bin]]
name = "showdown"
path = "src/main.rs"

[dependencies]
slimtoken = { path = "../.." }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
