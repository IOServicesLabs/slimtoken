[package]
name = "slimtoken"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A concurrency-first DAG harness for local LLM coding and agent workloads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IOServicesLabs/slimtoken"
homepage = "https://github.com/IOServicesLabs/slimtoken"
documentation = "https://docs.rs/slimtoken"
# Release packaging ships the engine (src), host guides (README, API,
# EMBEDDING, ENGINE), the shipped profile library, and examples. Sidecar
# packs stay in the repo only; hosts install them from there.
exclude = [
    "sidecars/",
]

[lib]
name = "slimtoken"
path = "src/lib.rs"

[[bin]]
name = "slimtoken"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "=1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[features]
# The default build is the bare engine: embedders get no server deps.
# `serve` adds the axum-based REST API (`slimtoken serve`, `slimtoken::api`).
default = []
serve = ["dep:axum"]

[profile.release]
lto = "thin"
codegen-units = 1
